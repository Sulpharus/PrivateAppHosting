# Platform services on the NucBox Linux VM. Lives at /srv/mininode/platform on the VM.
#   docker compose --env-file platform.env up -d
# platform.env holds the image digests written by nucbox-deploy; secrets.env (decrypted from
# secrets.sops.env) holds credentials. Container apps are separate compose projects under
# /srv/mininode/apps/<slug>, generated by nucbox-deploy, joined to the `mininode` network.

name: mininode

networks:
  mininode:
    name: mininode

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [mininode]
  logging:
    driver: local
    options: { max-size: "10m", max-file: "3" }

services:
  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    # ssh.mininode.app → the VM's sshd (forced-command deploy user only).
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m

  traefik:
    <<: *hardening
    image: traefik:v3
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=mininode
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --ping=true
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s

  nucbox-control:
    <<: *hardening
    image: ghcr.io/sulpharus/mininode-nucbox-control@${CONTROL_DIGEST:?}
    env_file: [secrets.env]
    environment:
      PORT: "8080"
      DOCKER_NETWORK: mininode
      PROXMOX_CA_FILE: /etc/mininode/proxmox-ca.pem
    volumes:
      # Needed to start/stop Wine sessions. This is root-equivalent on the VM, which is why the
      # service only listens inside the compose network and behind Access + a bearer token.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./proxmox-ca.pem:/etc/mininode/proxmox-ca.pem:ro
    group_add: ["${DOCKER_GID:?}"]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 192m

  guacd:
    <<: *hardening
    image: guacamole/guacd:1.6.0
    mem_limit: 512m

  guacamole:
    <<: *hardening
    image: guacamole/guacamole:1.6.0
    depends_on: [guacd]
    environment:
      GUACD_HOSTNAME: guacd
      # Encrypted-JSON auth only: no user database, no admin UI. Tokens are minted by the
      # platform API (apps/api/src/lib/guacamole.ts) and expire after 60 s.
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET:?}
      WEBAPP_CONTEXT: ROOT
      REMOTE_IP_VALVE_ENABLED: "true"
    mem_limit: 512m
