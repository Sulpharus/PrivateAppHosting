name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Doctor all hosted apps
        run: pnpm mininode doctor --all
      - name: Dry-run deploy of changed apps (build + gate config)
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: dry-run
        run: |
          pnpm --filter @mininode/sdk build
          pnpm mininode deploy --changed "origin/${{ github.base_ref }}" --dry-run
      - name: Short app spec is up to date
        run: |
          pnpm spec:short
          git diff --exit-code docs/ai/NEW-APP-SPEC.short.md
      - name: Manifest JSON schema is up to date
        run: |
          pnpm --filter @mininode/manifest build
          git diff --exit-code packages/manifest/schema.json

  database:
    name: Database, integration and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start database (retries registry rate limits)
        run: |
          for attempt in 1 2 3; do
            pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor && exit 0
            echo "attempt $attempt failed, retrying in 30s"; sleep 30
          done
          exit 1
      - run: pnpm db:test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
