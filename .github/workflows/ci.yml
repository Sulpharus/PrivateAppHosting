name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Doctor all hosted apps
        run: pnpm mininode doctor --all
      - name: Dry-run deploy of changed apps (build + gate config)
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: dry-run
        run: |
          pnpm --filter @mininode/sdk build
          pnpm mininode deploy --changed "origin/${{ github.base_ref }}" --dry-run
      - name: Short app spec is up to date
        run: |
          pnpm spec:short
          git diff --exit-code docs/ai/NEW-APP-SPEC.short.md
      - name: Manifest JSON schema is up to date
        run: |
          pnpm --filter @mininode/manifest build
          git diff --exit-code packages/manifest/schema.json

  infra:
    name: Infra scripts and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        run: |
          shellcheck -S warning infra/cloudflare/*.sh infra/nucbox/deploy/nucbox-deploy \
            infra/nucbox/wine/entrypoint.sh infra/nucbox/backup/*.sh scripts/*.sh
      - name: Compose file is valid
        working-directory: infra/nucbox
        run: |
          TUNNEL_TOKEN=x GUACAMOLE_JSON_SECRET=x DOCKER_GID=999 CONTROL_DIGEST=sha256:0 \
            docker compose -f compose.yml config --quiet --no-interpolate
      - name: Build nucbox-control image
        run: docker build -f apps/nucbox-control/Dockerfile -t mininode-nucbox-control:ci .
      - name: Image smoke test
        run: |
          docker run -d --name control -p 8080:8080 \
            -e CONTROL_TOKEN=$(openssl rand -hex 32) -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=x -e PROXMOX_URL=https://127.0.0.1:8006 -e PROXMOX_TOKEN=x \
            -e WINDOWS_RDP_PASSWORD=x mininode-nucbox-control:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Host: demo.mininode.app' \
            -H 'Sec-Fetch-Mode: navigate' localhost:8080/auth)
          test "$code" = 302 || { docker logs control; exit 1; }

  database:
    name: Database, integration and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start database (retries registry rate limits)
        run: |
          for attempt in 1 2 3; do
            pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor && exit 0
            echo "attempt $attempt failed, retrying in 30s"; sleep 30
          done
          exit 1
      - run: pnpm db:test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
