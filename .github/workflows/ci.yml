name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs that test something a pull request did not touch are skipped; a push to main runs them
  # all (a cancelled earlier push must not leave its changes untested). Lint, typecheck, unit
  # tests, the starter and the secret scan always run. "Lint, typecheck, test" (required) passes
  # only when every job it waits for passed or was skipped on purpose.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
      infra: ${{ steps.diff.outputs.infra }}
      desktop: ${{ steps.diff.outputs.desktop }}
      hosted: ${{ steps.diff.outputs.hosted }}
      musescore: ${{ steps.diff.outputs.musescore }}
      crafts: ${{ steps.diff.outputs.crafts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        # bash gives pipefail: a failing script fails the job instead of leaving empty outputs.
        shell: bash
        # HEAD is the merge commit of a pull request; its first parent is the exact base.
        run: scripts/ci-changes.sh "${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}" | tee -a "$GITHUB_OUTPUT"

  # The patched program builds are only needed by the dry-run deploy of a pull request; on main
  # the Deploy workflow builds them.
  crafts:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.crafts != 'false'
    uses: ./.github/workflows/crafts.yml

  musescore:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.musescore != 'false'
    uses: ./.github/workflows/musescore.yml

  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Worker and Supabase config match mininode.config.json
        run: pnpm mininode configure --check
      - name: Doctor all hosted apps
        run: pnpm mininode doctor --all
      - name: Short app spec is up to date
        run: |
          pnpm spec:short
          git diff --exit-code docs/ai/NEW-APP-SPEC.short.md
      - name: Manifest JSON schema is up to date
        run: |
          pnpm --filter @mininode/manifest build
          git diff --exit-code packages/manifest/schema.json

  apps:
    name: Dry-run deploy of changed apps
    needs: [changes, crafts, musescore]
    # Runs after the program builds, also when they were skipped (their app did not change).
    if: >-
      !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.hosted != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patched program builds
        if: needs.crafts.result == 'success' || needs.musescore.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: craft-*
          path: craft-builds
      - name: Build and gate config of each changed app
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: dry-run
        run: |
          scripts/craft-builds.sh craft-builds
          pnpm --filter @mininode/sdk build
          pnpm mininode deploy --changed "origin/${{ github.base_ref }}" --dry-run

  infra:
    name: Infra scripts and images
    needs: changes
    if: needs.changes.outputs.infra != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The starter package regenerates its lockfile.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Change detection (which jobs a change runs)
        run: scripts/ci-changes.test.sh
      - name: Shellcheck
        run: |
          shellcheck -S warning infra/cloudflare/*.sh infra/desktop/install.sh infra/desktop/mininode-desktop infra/nucbox/deploy/nucbox-deploy \
            infra/nucbox/deploy/test.sh infra/nucbox/wine/entrypoint.sh infra/nucbox/backup/*.sh scripts/*.sh
      - name: nucbox-deploy rollouts (stubbed docker)
        run: |
          infra/nucbox/deploy/test.sh
          cd infra/nucbox/deploy/testdata && touch app.env
          for f in *.compose.yml; do docker compose -f "$f" config --quiet --no-interpolate; done
      - name: Release packages hold what they should
        run: |
          scripts/package-release.sh ci /tmp/release
          unzip -Z1 /tmp/release/mininode-pc-server-ci.zip | grep -q 'apps/nucbox-control/Dockerfile'
          unzip -Z1 /tmp/release/mininode-pc-server-ci.zip | grep -q 'README-EDITION.md'
          if unzip -Z1 /tmp/release/mininode-cloud-ci.zip | grep -q 'infra/nucbox/'; then
            echo "the cloud edition must not contain infra/nucbox" >&2; exit 1
          fi
          unzip -Z1 /tmp/release/mininode-complete-ci.zip | grep -q 'infra/nucbox/compose.yml'
      - name: Compose file is valid
        working-directory: infra/nucbox
        run: |
          TUNNEL_TOKEN=x GUACAMOLE_JSON_SECRET=x DOCKER_GID=999 CONTROL_DIGEST=sha256:0 \
            docker compose -f compose.yml config --quiet --no-interpolate
      - name: Build nucbox-control image
        run: docker build -f apps/nucbox-control/Dockerfile -t mininode-nucbox-control:ci .
      - name: Image smoke test
        run: |
          docker run -d --name control -p 8080:8080 \
            -e CONTROL_TOKEN=$(openssl rand -hex 32) -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=x -e PORTAL_URL=https://example.org -e PROXMOX_URL=https://127.0.0.1:8006 -e PROXMOX_TOKEN=x \
            -e WINDOWS_RDP_PASSWORD=x mininode-nucbox-control:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Host: demo.example.org' \
            -H 'Sec-Fetch-Mode: navigate' localhost:8080/auth)
          test "$code" = 302 || { docker logs control; exit 1; }

  starter:
    name: Starter package installs and passes its own checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the starter (also scans it for identifiers of this installation)
        run: scripts/make-starter.sh ci "$RUNNER_TEMP/out"
      - name: Unpack, set up an installation, run its checks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP" && unzip -q out/mininode-starter-ci.zip && cd mininode-starter-ci
          test -z "$(find hosted -mindepth 1 ! -name README.md)"
          pnpm install --frozen-lockfile
          pnpm mininode init --domain apps.example.org --zone example.org --accountId 0123456789abcdef0123456789abcdef \
            --supabaseRef abcdefghijklmnopqrst --publishableKey sb_publishable_0123456789abcdef --repository me/platform
          pnpm mininode configure --check
          pnpm check
          pnpm mininode doctor --all
      - name: The Cloudflare edition does the same without the desktop and home-server parts
        run: |
          set -euo pipefail
          scripts/make-starter.sh ci "$RUNNER_TEMP/out" cloudflare
          cd "$RUNNER_TEMP" && unzip -q out/mininode-cloudflare-ci.zip && cd mininode-cloudflare-ci
          test ! -e infra/desktop && test ! -e apps/desktop-host && test ! -e apps/nucbox-control
          pnpm install --frozen-lockfile
          pnpm mininode init --domain apps.example.org --zone example.org --accountId 0123456789abcdef0123456789abcdef \
            --supabaseRef abcdefghijklmnopqrst --publishableKey sb_publishable_0123456789abcdef --repository me/platform
          pnpm mininode configure --check
          pnpm check

  desktop:
    name: Desktop edition installs and signs in
    needs: changes
    if: needs.changes.outputs.desktop != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install (the real installer)
        env:
          MININODE_ADMIN_PASSWORD: ci-password-${{ github.run_id }}-abcdef
        run: infra/desktop/install.sh --dir "$RUNNER_TEMP/mininode" --admin-email ci@example.org
      - name: Sign in through the host, with the keys made by the installer
        env:
          PASSWORD: ci-password-${{ github.run_id }}-abcdef
        run: |
          set -euo pipefail
          key=$(sed -n "s/^SUPABASE_PUBLISHABLE_KEY='\(.*\)'\$/\1/p" "$RUNNER_TEMP/mininode/.env")
          curl -fsS http://mininode.localhost:8787/config.json | jq -e '.supabaseUrl == "http://supabase.mininode.localhost:8787"'
          curl -fsS http://supabase.mininode.localhost:8787/auth/v1/.well-known/jwks.json | jq -e '.keys | length == 1 and (.[0] | has("d") | not)'
          token=$(curl -fsS -X POST 'http://supabase.mininode.localhost:8787/auth/v1/token?grant_type=password' \
            -H "apikey: $key" -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.org\",\"password\":\"$PASSWORD\"}" | jq -r .access_token)
          claims=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "$claims" | jq -e '.mn_role == "admin" and .iss == "http://supabase.mininode.localhost:8787/auth/v1"'
          # The data API answers a signed-in admin, and refuses a visitor.
          curl -fsS "http://supabase.mininode.localhost:8787/rest/v1/profiles?select=role" -H "apikey: $key" \
            -H "Authorization: Bearer $token" -H 'Accept-Profile: platform' | jq -e '.[0].role == "admin"'
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://supabase.mininode.localhost:8787/rest/v1/profiles?select=role" \
            -H "apikey: $key" -H 'Accept-Profile: platform')
          test "$code" != 200
          # First-run setup is closed for good once the installer made the admin.
          curl -fsS http://api.mininode.localhost:8787/setup | jq -e '.open == false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://api.mininode.localhost:8787/setup \
            -H 'Content-Type: application/json' -d '{"email":"intruder@example.org","password":"another long password"}')
          test "$code" = 409
      - name: Containers on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/mininode" && docker compose ps && docker compose logs --tail 60

  database:
    name: Database, integration and e2e
    needs: changes
    # A change to bundled documentation alone runs only the e2e tests of the pages that show it.
    if: needs.changes.outputs.code != 'false' || needs.changes.outputs.docs != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start database (retries registry rate limits)
        run: |
          for attempt in 1 2 3; do
            pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor && exit 0
            echo "attempt $attempt failed, retrying in 30s"; sleep 30
          done
          exit 1
      - if: needs.changes.outputs.code != 'false'
        run: pnpm db:test
      - if: needs.changes.outputs.code != 'false'
        run: pnpm test:integration
      - name: Backup and restore round trip (empties the database, so on its own)
        if: needs.changes.outputs.code != 'false'
        run: pnpm test:roundtrip
      - run: pnpm exec playwright install --with-deps chromium
      - if: needs.changes.outputs.code != 'false'
        run: pnpm e2e
      - name: e2e of the documentation pages only (nothing but documentation changed)
        if: needs.changes.outputs.code == 'false'
        env:
          E2E_PORTAL_ONLY: '1'
        run: pnpm e2e wiki.spec.ts library.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The required check: the fast unit-test job and everything that must pass before a merge.
  # Skipped jobs (nothing they test changed) count as passed; a failed or cancelled one does not.
  result:
    name: Lint, typecheck, test
    needs: [changes, check, apps, infra, database]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' > /dev/null
