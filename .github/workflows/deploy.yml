name: Deploy

# Runs after CI on main. Order: database → platform Workers → hosted apps → NucBox containers.
# Secrets and variables live in the GitHub environment (production / staging); see
# docs/runbooks/first-setup.md for the full list.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production
      all_apps:
        description: Redeploy every hosted app (not only changed ones)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment || 'production' }}

jobs:
  database:
    name: Database migrations
    # Skipped until the environment is configured (docs/runbooks/first-setup.md).
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Push platform migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push

  platform:
    name: Platform Workers
    needs: database
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Portal
        working-directory: apps/portal
        run: |
          pnpm build
          pnpm exec wrangler deploy \
            --var "SUPABASE_URL:${{ vars.SUPABASE_URL }}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
      - name: API
        working-directory: apps/api
        run: |
          pnpm exec wrangler deploy \
            --var "SUPABASE_URL:${{ vars.SUPABASE_URL }}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
      - name: AI proxy
        working-directory: apps/ai-proxy
        run: |
          pnpm exec wrangler deploy \
            --var "SUPABASE_URL:${{ vars.SUPABASE_URL }}" \
            --var "SUPABASE_PUBLISHABLE_KEY:${{ vars.SUPABASE_PUBLISHABLE_KEY }}" \
            --var "AI_GATEWAY_BASE:${{ vars.AI_GATEWAY_BASE }}"

  apps:
    name: Hosted apps
    needs: platform
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      containers: ${{ steps.containers.outputs.list }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mininode/sdk build
      - name: Deploy changed apps
        run: |
          if [ "${{ inputs.all_apps }}" = "true" ] || [ "${{ github.event.before }}" = "" ] \
             || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            for dir in hosted/*/; do
              [ -f "$dir/mininode.json" ] && pnpm mininode deploy "$dir" --env "$DEPLOY_ENV"
            done
          else
            pnpm mininode deploy --changed "${{ github.event.before }}" --env "$DEPLOY_ENV"
          fi
      - name: List container apps to roll out
        id: containers
        run: |
          list=$(node -e '
            const fs = require("node:fs");
            const apps = fs.readdirSync("hosted", { withFileTypes: true }).filter((d) => d.isDirectory())
              .map((d) => d.name).filter((slug) => {
                try { return JSON.parse(fs.readFileSync(`hosted/${slug}/mininode.json`, "utf8")).target === "nucbox"; }
                catch { return false; }
              });
            process.stdout.write(JSON.stringify(apps));')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  nucbox:
    name: NucBox container ${{ matrix.slug }}
    needs: apps
    if: needs.apps.outputs.containers != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        slug: ${{ fromJson(needs.apps.outputs.containers) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: hosted/${{ matrix.slug }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mininode-${{ matrix.slug }}:${{ github.sha }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mininode-${{ matrix.slug }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      - name: Roll out on the NucBox (forced-command SSH through Cloudflare Access)
        env:
          SSH_KEY: ${{ secrets.NUCBOX_DEPLOY_SSH_KEY }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new \
            -o ProxyCommand="cloudflared access ssh --hostname %h --id $TUNNEL_SERVICE_TOKEN_ID --secret $TUNNEL_SERVICE_TOKEN_SECRET" \
            deploy@ssh.mininode.app "${{ matrix.slug }} ${{ steps.build.outputs.digest }}"
