name: App aktualisieren

# Brings the newest version of one hosted app from its own GitHub repository (the `repository`
# field of its mininode.json) into this repository (ADR 0028). Started from Verwaltung →
# Updates through the API, or by hand under Actions.
#
# `mininode update app` copies the repository's files over hosted/<slug>. The data of the app is
# in Supabase and is not touched; an already applied migration in db/ is never changed (such a
# repository stops here). The result is a pull request (branch auto/update-<slug>-…): the normal
# checks run on it, and merging it deploys the app. Started by hand it is never merged
# automatically: the app brings code and manifest from outside this repository, so a person reads
# it first. Started by auto-update-apps.yml for an app with automatic updates (ADR 0029), it is set
# to merge itself once the required checks pass, but only when the app's mininode.json (rights,
# domains, keys, data mode) stays the same apart from `repository`; otherwise it waits for a
# person. The checks start by themselves only when the secret INTEGRATE_TOKEN is set (pushes with
# the default token do not start workflows); without it nothing is merged automatically.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App (hosted/<slug>)
        type: string
        required: true
  workflow_call:
    inputs:
      slug:
        type: string
        required: true
      auto:
        description: Merge by itself when the checks pass and the manifest stays the same
        type: boolean
        default: false

run-name: App aktualisieren ${{ inputs.slug }}

permissions:
  contents: read

concurrency:
  group: update-app-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  update:
    name: Update ${{ inputs.slug }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SLUG: ${{ inputs.slug }}
      # Whether the pull request can start the checks (a push with the default token cannot).
      HAS_TOKEN: ${{ secrets.INTEGRATE_TOKEN != '' }}
      AUTO: ${{ inputs.auto == true }}
    steps:
      - name: Check the address
        run: |
          [[ "$SLUG" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]] || { echo "::error::invalid slug"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the app's repository
        id: source
        env:
          # A private app repository needs a key that can read it.
          CLONE_TOKEN: ${{ secrets.EXPORT_REPO_TOKEN || secrets.INTEGRATE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          [ -f "hosted/$SLUG/mininode.json" ] || { echo "::error::hosted/$SLUG does not exist"; exit 1; }
          repository=$(jq -r '.repository // empty' "hosted/$SLUG/mininode.json")
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && ! "$repository" =~ (^|/)\.+(/|$) ]] || {
            echo "::error::hosted/$SLUG/mininode.json has no \"repository\" (owner/repo)"; exit 1; }
          git clone -q --depth 1 "https://x-access-token:${CLONE_TOKEN}@github.com/${repository}.git" "$RUNNER_TEMP/clone"
          commit=$(git -C "$RUNNER_TEMP/clone" rev-parse HEAD)
          rm -rf "$RUNNER_TEMP/clone/.git"
          known=$(jq -r '.commit // empty' "hosted/$SLUG/.mininode-source.json" 2>/dev/null || true)
          { echo "repository=$repository"; echo "commit=$commit"; echo "known=$known"; } >> "$GITHUB_OUTPUT"
      - name: Apply the update
        id: apply
        env:
          REPOSITORY: ${{ steps.source.outputs.repository }}
          COMMIT: ${{ steps.source.outputs.commit }}
          KNOWN: ${{ steps.source.outputs.known }}
        run: |
          set -euo pipefail
          if [ "$COMMIT" = "$KNOWN" ]; then
            echo "$SLUG is already at ${COMMIT:0:7}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The manifest before, without the fields that only say where updates come from.
          jq -S 'del(.repository, .autoUpdate)' "hosted/$SLUG/mininode.json" > "$RUNNER_TEMP/before.json"
          auto_flag=$(jq '.autoUpdate // false' "hosted/$SLUG/mininode.json")
          pnpm mininode update app "$SLUG" --from "$RUNNER_TEMP/clone" --repository "$REPOSITORY" --commit "$COMMIT" | tee "$RUNNER_TEMP/plan.txt"
          # The repository's manifest is kept as it is, plus the link back to the repository (and
          # this installation's wish for automatic updates).
          jq --arg r "$REPOSITORY" --argjson a "$auto_flag" \
            '.repository = $r | if $a then .autoUpdate = true else del(.autoUpdate) end' \
            "hosted/$SLUG/mininode.json" > "$RUNNER_TEMP/mininode.json"
          mv "$RUNNER_TEMP/mininode.json" "hosted/$SLUG/mininode.json"
          jq -S 'del(.repository, .autoUpdate)' "hosted/$SLUG/mininode.json" > "$RUNNER_TEMP/after.json"
          if cmp -s "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json"; then
            echo "manifest_same=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_same=false" >> "$GITHUB_OUTPUT"
          fi
          pnpm exec biome format --write "hosted/$SLUG/mininode.json"
          pnpm install --lockfile-only --ignore-scripts
          pnpm mininode doctor "hosted/$SLUG"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.INTEGRATE_TOKEN || github.token }}
          REPOSITORY: ${{ steps.source.outputs.repository }}
          COMMIT: ${{ steps.source.outputs.commit }}
          MANIFEST_SAME: ${{ steps.apply.outputs.manifest_same }}
        run: |
          set -euo pipefail
          open=$(gh pr list --state open --json headRefName --jq "[.[] | select(.headRefName | startswith(\"auto/update-$SLUG-\"))] | length")
          if [ "$open" != "0" ]; then
            echo "An update pull request for $SLUG is already open: merge or close it first." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "mininode-update"
          git config user.email "update@users.noreply.github.com"
          branch="auto/update-$SLUG-${COMMIT:0:7}-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git add -A
          bad=$(git diff --cached --name-only | grep -vE "^(hosted/$SLUG/|pnpm-lock\.yaml$)" || true)
          [ -z "$bad" ] || { echo "unexpected files: $bad" >&2; exit 1; }
          git commit -q -m "chore($SLUG): update to ${COMMIT:0:7}" \
            -m "Brought in from $REPOSITORY with mininode update app."
          git push -q origin "$branch"
          body="Aktualisiert die App \`$SLUG\` auf den Stand \`${COMMIT:0:7}\` von \`$REPOSITORY\`.

          $(cat "$RUNNER_TEMP/plan.txt")

          Die Daten der App liegen in Supabase und bleiben unverändert. Bereits angewendete Migrationen in \`db/\` werden nie geändert, nur neue kommen dazu."
          if [ "$AUTO" = "true" ] && [ "$HAS_TOKEN" = "true" ] && [ "$MANIFEST_SAME" = "true" ]; then
            merge=auto
            body="$body

          Automatisches Update (ADR 0029): Die \`mininode.json\` bleibt gleich, darum mergt sich dieser Pull Request selbst, sobald die Pflicht-Prüfungen grün sind; danach deployt der normale Ablauf die App."
          else
            merge=manual
            reason=""
            [ "$AUTO" = "true" ] && [ "$MANIFEST_SAME" != "true" ] && reason=" Die App hat automatische Updates, aber die \`mininode.json\` (Rechte, Domains, Schlüssel) ändert sich: darum wartet er auf dich."
            body="$body

          Die Änderungen (auch an der \`mininode.json\`: Rechte, Domains) bitte lesen und erst mergen, wenn die Prüfungen grün sind; danach deployt der normale Ablauf die App. Dieser Pull Request wird nicht automatisch gemergt.$reason"
          fi
          pr=$(gh pr create --base main --head "$branch" --title "chore($SLUG): update to ${COMMIT:0:7}" --body "$body")
          # Merged by itself only for automatic updates with an unchanged manifest: anything that
          # changes permissions or domains is read by a person first.
          [ "$HAS_TOKEN" = "true" ] || echo "::warning::INTEGRATE_TOKEN is not set: the pull request gets no checks. Do not merge it unchecked."
          if [ "$merge" = "auto" ]; then
            # Waits for the required checks of main. Without such a rule on main (Settings → Rules)
            # or without "Allow auto-merge" this fails and the pull request just stays open.
            gh pr merge "$pr" --auto --merge || echo "::warning::auto-merge is not available; the pull request stays open"
          fi
          echo "Pull request: $pr" >> "$GITHUB_STEP_SUMMARY"
