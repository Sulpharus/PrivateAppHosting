name: Release
# Registered with GitHub on the default branch (touched again so Actions lists it).

# Builds the starter package (scripts/package-release.sh starter) and attaches it to a GitHub release.
#   v0.1.0       the release; the title is the subject of the annotated tag
#   v0.1.0-test  the same, marked as a pre-release
# Only the starter is published: the other editions are cut from the whole repository, which
# holds the owner's own apps and settings. Push the tag, or run this workflow by hand with an
# existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Version from the tag
        id: plan
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "unsupported tag: $TAG" >&2; exit 1 ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # The starter's lockfile is regenerated without the apps, which needs Node and pnpm.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the starter
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: scripts/package-release.sh "$VERSION" release-out starter
      - name: Check the checksums
        run: cd release-out && sha256sum -c SHA256SUMS
      - name: Publish
        run: |
          title=$(git tag -l --format='%(contents:subject)' "$TAG")
          [ -n "$title" ] || title="$TAG"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          notes="**Starter** (\`mininode-starter-*.zip\`): the whole platform without apps and without anything of the installation that built it. It holds the Cloudflare setup, the desktop installer for Docker (Windows, macOS, Linux), the optional home-server side and every instruction.

          Start with \`docs/runbooks/getting-started.md\` after unpacking. License: PolyForm Noncommercial 1.0.0 (\`LICENSE\`).

          Checksum: \`SHA256SUMS\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-out/* --clobber
          else
            gh release create "$TAG" release-out/* --title "$title" --notes "$notes" "${flags[@]}" --verify-tag
          fi
