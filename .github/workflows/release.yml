name: Release

# Packages the editions and attaches them to a GitHub release (scripts/package-release.sh).
#   v1.2.0            all three: cloud, pc-server and complete
#   cloud-v1.2.0      only the Cloud edition (own version)
#   pc-server-v1.2.0  only the PC/server edition (own version)
# Push the tag, or run this workflow by hand with an existing tag.

on:
  push:
    tags: ["v*", "cloud-v*", "pc-server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Editions and version from the tag
        id: plan
        run: |
          case "$TAG" in
            cloud-v*)     editions="cloud";                    version="${TAG#cloud-v}" ;;
            pc-server-v*) editions="pc-server";                version="${TAG#pc-server-v}" ;;
            v*)           editions="cloud pc-server complete"; version="${TAG#v}" ;;
            *) echo "unsupported tag: $TAG" >&2; exit 1 ;;
          esac
          { echo "editions=$editions"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - name: Build the packages
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          EDITIONS: ${{ steps.plan.outputs.editions }}
        run: |
          # shellcheck disable=SC2086
          scripts/package-release.sh "$VERSION" release-out $EDITIONS
      - name: Check the checksums
        run: cd release-out && sha256sum -c SHA256SUMS
      - name: Publish
        run: |
          notes="Editions of this release:
          - **Cloud** (\`mininode-cloud-*.zip\`): the platform for Cloudflare + Supabase.
          - **PC/server** (\`mininode-pc-server-*.zip\`): the home-server side (Proxmox VE host, Linux VM with Docker, optional Windows 11 VM). See its README-EDITION.md for operating systems.
          - **Complete** (\`mininode-complete-*.zip\`): the whole repository.

          Checksums: \`SHA256SUMS\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-out/* --clobber
          else
            gh release create "$TAG" release-out/* --title "$TAG" --notes "$notes" --verify-tag
          fi
