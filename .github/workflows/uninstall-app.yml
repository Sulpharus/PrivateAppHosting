name: App löschen

# Uninstalls a hosted app (ADR 0020), started from Verwaltung → Apps → Löschen through the API
# or by hand under Actions.
#
#   remove   (secrets)     mininode uninstall: the Worker is deleted; with "purge" also the data
#                          (schema, files, logo, registry entry). The key of the Cloudflare and
#                          Supabase accounts is only in the environment of that one step.
#   code     (token)       hosted/<slug> is removed in a pull request (branch auto/remove-<slug>-…),
#                          so the next deploy cannot bring the app back. With the repository
#                          variable INTEGRATE_AUTOMERGE=true the PR merges itself once the checks
#                          pass.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App (hosted/<slug>)
        type: string
        required: true
      purge:
        description: Also delete the data, files and registry entry of the app
        type: boolean
        default: true
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production

run-name: App löschen ${{ inputs.slug }}${{ inputs.purge && ' mit Daten' || '' }}

permissions:
  contents: read

# The deploy's group: a deploy of the same app must not run between the uninstall and its pull
# request (it would bring the app back), and both change the Data API's schema list.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  uninstall:
    name: Uninstall ${{ inputs.slug }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
    env:
      SLUG: ${{ inputs.slug }}
      PURGE: ${{ inputs.purge }}
      DEPLOY_ENV: ${{ inputs.environment }}
      SUPABASE_URL: ${{ inputs.environment == 'production' && 'https://ojicmpgqvoyakigvubek.supabase.co' || 'https://ttgrtecdqouiogiwcjag.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ inputs.environment == 'production' && 'sb_publishable_jv1tZqYWg51sNxJ5-GjMMw_tZqa1s1C' || 'sb_publishable_zQfFz-ruNPkIQauwa253iw_4zOZmiOB' }}
      SUPABASE_PROJECT_REF: ${{ inputs.environment == 'production' && 'ojicmpgqvoyakigvubek' || 'ttgrtecdqouiogiwcjag' }}
      CLOUDFLARE_ACCOUNT_ID: d690896e2d267adb0dd97027832767e5
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      AUTOMERGE: ${{ vars.INTEGRATE_AUTOMERGE }}
    steps:
      - name: Check the address
        run: |
          [[ "$SLUG" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]] || { echo "::error::invalid slug"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The token is used by the push step only, not left in .git/config for the steps that
          # run the repository's code with the keys.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Uninstall (Worker, and with purge the data)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          flags=(--env "$DEPLOY_ENV")
          [ "$PURGE" = "true" ] && flags+=(--purge)
          pnpm mininode uninstall "$SLUG" "${flags[@]}"
      - name: Remove the code in a pull request
        env:
          GH_TOKEN: ${{ secrets.INTEGRATE_TOKEN || github.token }}
        run: |
          if [ ! -d "hosted/$SLUG" ]; then
            echo "hosted/$SLUG is not in the repository: nothing to remove"
            exit 0
          fi
          # Not twice: a re-run, or an earlier pull request that is still open.
          open=$(gh pr list --state open --search "chore($SLUG): App entfernen in:title" --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "A pull request that removes $SLUG is already open"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "mininode-uninstall"
          git config user.email "uninstall@users.noreply.github.com"
          branch="auto/remove-$SLUG-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git rm -r -q "hosted/$SLUG"
          pnpm mininode exempt "$SLUG" --remove
          pnpm install --lockfile-only --ignore-scripts
          pnpm exec biome format --write biome.json
          git add -A pnpm-lock.yaml biome.json
          bad=$(git diff --cached --name-only | grep -vE "^(hosted/$SLUG/|pnpm-lock\.yaml$|biome\.json$)" || true)
          [ -z "$bad" ] || { echo "unexpected files: $bad" >&2; exit 1; }
          git commit -m "chore($SLUG): remove the app" \
            -m "Uninstalled from Verwaltung → Apps (purge: $PURGE). The Worker is deleted; this removes the code so no deploy brings the app back."
          git push origin "$branch"
          pr=$(gh pr create --base main --head "$branch" \
            --title "chore($SLUG): App entfernen" \
            --body "Die App \`$SLUG\` wurde in Verwaltung gelöscht (Daten gelöscht: $PURGE). Dieser Pull Request entfernt ihren Code, damit kein Deploy sie zurückbringt. Mergen, wenn die Prüfungen grün sind.")
          if [ "$AUTOMERGE" = "true" ]; then
            gh pr merge "$pr" --auto --merge || echo "auto-merge is not available; the pull request stays open"
          fi
          echo "Pull request: $pr" >> "$GITHUB_STEP_SUMMARY"
