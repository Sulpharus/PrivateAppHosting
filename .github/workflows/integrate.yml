name: Web-App einbauen
# Registered with GitHub on the default branch (touched again so Actions lists it).

# Integrates an uploaded ZIP (Verwaltung → Hochladen, ADR 0013). Started by the API.
#
#   fetch    (secrets)     downloads the ZIP from the private bucket
#   build    (NO secrets)  `mininode integrate` rewrites the export, checks it with doctor and
#                          builds it. The export's own build code (PostCSS and Tailwind configs,
#                          dependencies) runs only here, with no token and no key in reach.
#   publish  (secrets)     success: branch auto/<slug>-<id> and a pull request (status "Pull Request
#                          offen"; pr-merged.yml sets "Eingebaut" on the merge). With the repository
#                          variable INTEGRATE_AUTOMERGE=true the PR is set to auto-merge, which
#                          waits for the required checks of main. The script could not finish:
#                          branch review/<id> with the ZIP and the report, and an issue labelled
#                          `ai-review` (integrate-app skill).
#
# Pushes made with the default token do not start other workflows. Set the secret INTEGRATE_TOKEN
# (contents and pull requests: write) so CI and the deploy run on what this creates.

on:
  workflow_dispatch:
    inputs:
      submission:
        description: Upload id (platform.submissions)
        type: string
        required: true
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: integrate-${{ inputs.submission }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment }}
  SUPABASE_URL: ${{ inputs.environment == 'production' && 'https://ojicmpgqvoyakigvubek.supabase.co' || 'https://ttgrtecdqouiogiwcjag.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ inputs.environment == 'production' && 'sb_publishable_jv1tZqYWg51sNxJ5-GjMMw_tZqa1s1C' || 'sb_publishable_zQfFz-ruNPkIQauwa253iw_4zOZmiOB' }}
  SUBMISSION: ${{ inputs.submission }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  fetch:
    name: Fetch ${{ inputs.submission }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mark as running
        run: pnpm mininode submission status "$SUBMISSION" integrating --run "$RUN_URL" --env "$DEPLOY_ENV"
      - name: Download the ZIP
        run: |
          mkdir -p upload
          pnpm mininode submission fetch "$SUBMISSION" --out upload/upload.zip --env "$DEPLOY_ENV" | tail -n1 > upload/filename.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upload
          path: upload
          retention-days: 3

  build:
    name: Integrate by script
    needs: fetch
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.integrate.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # No cache: this job runs the export's code and must not write what other jobs restore.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: upload
          path: upload
      - name: Integrate
        id: integrate
        run: |
          set +e
          pnpm mininode integrate upload/upload.zip --build --tidy --json result.json --report report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Collect the result
        env:
          CODE: ${{ steps.integrate.outputs.code }}
        run: |
          mkdir -p out
          cp result.json report.md out/
          slug=$(jq -r '.slug // empty' result.json)
          # Only the app's own folder leaves this job: the lockfile and biome.json are made again
          # by the publish job, which does not run the export's code.
          if [ "$CODE" = "0" ] && [[ "$slug" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]]; then
            mkdir -p "out/hosted"
            cp -r "hosted/$slug" "out/hosted/$slug"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: out
          retention-days: 3

  publish:
    name: Publish or hand over
    needs: [fetch, build]
    if: always() && needs.fetch.result != 'skipped'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      GH_TOKEN: ${{ secrets.INTEGRATE_TOKEN || github.token }}
      CODE: ${{ needs.build.outputs.code }}
      AUTOMERGE: ${{ vars.INTEGRATE_AUTOMERGE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.INTEGRATE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        if: needs.build.result == 'success'
        with:
          pattern: "*"
          path: artifacts
      - name: Publish the app
        if: env.CODE == '0'
        run: |
          slug=$(jq -r .slug artifacts/result/result.json)
          [[ "$slug" =~ ^[a-z][a-z0-9-]{0,30}[a-z0-9]$ ]] || { echo "bad slug" >&2; exit 1; }
          short=${SUBMISSION:0:8}
          src="artifacts/result/hosted/$slug"
          [ -d "$src" ] || { echo "no app in the result" >&2; exit 1; }
          # What came out of the build job is only the app's folder, and it must hold plain files.
          if [ -n "$(find "$src" -type l)" ]; then echo "links in the result" >&2; exit 1; fi
          [ ! -e "hosted/$slug" ] || { echo "hosted/$slug exists" >&2; exit 1; }
          cp -r "$src" "hosted/$slug"
          # Root files are made here, in the job that does not run the export's code.
          pnpm install --lockfile-only --ignore-scripts
          if [ "$(jq -r '.lintExempt // false' artifacts/result/result.json)" = "true" ]; then
            # Code that Biome cannot read at all (a syntax error) is left out of Biome entirely;
            # turning the linter off would not stop `pnpm lint` from failing on it.
            if [ "$(jq -r '.biomeSkip // false' artifacts/result/result.json)" = "true" ]; then
              pnpm mininode exempt "$slug" --skip
            else
              pnpm mininode exempt "$slug"
            fi
            pnpm exec biome format --write biome.json
          fi
          git config user.name "mininode-integrate"
          git config user.email "integrate@users.noreply.github.com"
          git checkout -b "auto/$slug-$short"
          git add "hosted/$slug" pnpm-lock.yaml biome.json
          # Nothing else may be part of the commit.
          bad=$(git diff --cached --name-only | grep -vE "^(hosted/$slug/|pnpm-lock\.yaml$|biome\.json$)" || true)
          [ -z "$bad" ] || { echo "unexpected files: $bad" >&2; exit 1; }
          git commit -m "feat($slug): integrate uploaded export automatically" \
            -m "Built by mininode integrate from an upload in Verwaltung. See hosted/$slug/README.md."
          # The report contains names taken from the upload: show it as code, not as markup.
          fence=$(printf '\140\140\140')
          # The marker lets pr-merged.yml find the upload again when the pull request is merged.
          {
            echo "<!-- mininode-submission id=$SUBMISSION env=$DEPLOY_ENV -->"
            echo "Automatisch eingebaut (Verwaltung → Hochladen). Bericht:"
            echo "${fence}text"
            sed "s/${fence}/'''/g" artifacts/result/report.md
            echo "$fence"
            echo
            echo "Mergen erst, wenn alle Prüfungen grün sind."
          } > body.md
          # Never straight to main: CI has to see the app first. The upload shows "Pull Request
          # offen" until the merge (pr-merged.yml turns it into "Eingebaut").
          git push origin "auto/$slug-$short"
          pr=$(gh pr create --base main --head "auto/$slug-$short" \
            --title "feat($slug): automatisch integriert" --body-file body.md)
          # The status first: a quick auto-merge must not be overwritten by it afterwards.
          pnpm mininode submission status "$SUBMISSION" pr_open \
            --result artifacts/result/result.json --report artifacts/result/report.md \
            --pr "$pr" --run "$RUN_URL" --env "$DEPLOY_ENV"
          if [ "$AUTOMERGE" = "true" ]; then
            # Merges when the required checks of main pass. Without such a rule on main (Settings →
            # Rules) or without "Allow auto-merge" this fails and the pull request just stays open.
            gh pr merge "$pr" --auto --merge || echo "auto-merge is not available; the pull request stays open"
          fi
      - name: Hand over to the AI review
        if: env.CODE == '2'
        run: |
          short=${SUBMISSION:0:8}
          filename=$(cat artifacts/upload/filename.txt)
          branch="review/$short"
          git config user.name "mininode-integrate"
          git config user.email "integrate@users.noreply.github.com"
          git checkout -b "$branch"
          mkdir -p "review-inbox/$short"
          cp artifacts/upload/upload.zip "review-inbox/$short/$filename"
          cp artifacts/result/report.md "review-inbox/$short/REPORT.md"
          git add -f "review-inbox/$short"
          git commit -m "chore: upload $short waits for AI review"
          git push origin "$branch"
          gh label create ai-review --color 5319e7 --description "Upload the integration script could not finish" --force
          {
            echo "<!-- mininode-submission id=$SUBMISSION env=$DEPLOY_ENV -->"
            echo "Ein Upload braucht eine KI-Prüfung. Das ZIP liegt im Branch \`$branch\` unter \`review-inbox/$short/\`."
            echo
            fence=$(printf '\140\140\140')
            echo "${fence}text"
            sed "s/${fence}/'''/g" artifacts/result/report.md
            echo "$fence"
            echo
            echo "**So geht's weiter:** Claude Code mit dem Skill \`integrate-app\` starten (\"arbeite die ai-review-Issues ab\"). Der Lauf baut die App nach \`hosted/<slug>\`, eröffnet einen PR mit \`Closes #<diese Issue>\` und räumt den Branch \`$branch\` ab. Beim Schließen der Issue erscheint die App in Verwaltung → Hochladen als eingebaut."
          } > issue.md
          issue=$(gh issue create --title "KI-Prüfung: $filename" --label ai-review --body-file issue.md)
          pnpm mininode submission status "$SUBMISSION" needs_review \
            --result artifacts/result/result.json --report artifacts/result/report.md \
            --review "$issue" --run "$RUN_URL" --env "$DEPLOY_ENV"
      - name: Report a crash
        if: env.CODE != '0' && env.CODE != '2'
        run: |
          printf 'Der Einbau ist abgestürzt. Protokoll: %s\n' "$RUN_URL" > crash.md
          pnpm mininode submission status "$SUBMISSION" failed --report crash.md \
            --run "$RUN_URL" --env "$DEPLOY_ENV"
