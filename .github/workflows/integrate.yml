name: Web-App einbauen

# Integrates an uploaded ZIP (Verwaltung → Hochladen, ADR 0013). Started by the API.
# 1. `mininode integrate` rewrites the export by script, checks it with doctor and builds it.
# 2. Success: the app goes to a branch `auto/<slug>-<id>` and a pull request. With the repository
#    variable INTEGRATE_AUTOMERGE=true it is pushed to main instead (the deploy then starts).
# 3. The script could not finish: the ZIP and the report go to a branch `review/<id>` and an issue
#    labelled `ai-review`; a Claude Code session works that queue (integrate-app skill).
# Pushes made with the default token do not start other workflows. Set the secret INTEGRATE_TOKEN
# (a token with contents and pull-request write) so CI and the deploy run on what this creates.

on:
  workflow_dispatch:
    inputs:
      submission:
        description: Upload id (platform.submissions)
        type: string
        required: true
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: integrate-${{ inputs.submission }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment }}
  SUPABASE_URL: ${{ inputs.environment == 'production' && 'https://ojicmpgqvoyakigvubek.supabase.co' || 'https://ttgrtecdqouiogiwcjag.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ inputs.environment == 'production' && 'sb_publishable_jv1tZqYWg51sNxJ5-GjMMw_tZqa1s1C' || 'sb_publishable_zQfFz-ruNPkIQauwa253iw_4zOZmiOB' }}

jobs:
  integrate:
    name: integrate ${{ inputs.submission }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      SUBMISSION: ${{ inputs.submission }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ secrets.INTEGRATE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.INTEGRATE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mark as running
        run: pnpm mininode submission status "$SUBMISSION" integrating --run "$RUN_URL" --env "$DEPLOY_ENV"
      - name: Download the ZIP
        run: pnpm mininode submission fetch "$SUBMISSION" --out "$RUNNER_TEMP/upload.zip" --env "$DEPLOY_ENV" | tee "$RUNNER_TEMP/filename.txt"
      - name: Integrate by script
        id: integrate
        run: |
          set +e
          pnpm mininode integrate "$RUNNER_TEMP/upload.zip" --build --tidy \
            --json "$RUNNER_TEMP/result.json" --report "$RUNNER_TEMP/report.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish the app
        if: steps.integrate.outputs.code == '0'
        run: |
          slug=$(jq -r .slug "$RUNNER_TEMP/result.json")
          short=${SUBMISSION:0:8}
          git config user.name "mininode-integrate"
          git config user.email "integrate@users.noreply.github.com"
          git checkout -b "auto/$slug-$short"
          git add "hosted/$slug" pnpm-lock.yaml biome.json
          git commit -m "feat($slug): integrate uploaded export automatically" \
            -m "Built by mininode integrate from an upload in Verwaltung. See hosted/$slug/README.md."
          if [ "${{ vars.INTEGRATE_AUTOMERGE }}" = "true" ]; then
            git push origin "HEAD:refs/heads/main"
            pr=""
          else
            git push origin "auto/$slug-$short"
            pr=$(gh pr create --base main --head "auto/$slug-$short" \
              --title "feat($slug): automatisch integriert" \
              --body-file "$RUNNER_TEMP/report.md")
          fi
          pnpm mininode submission status "$SUBMISSION" integrated \
            --result "$RUNNER_TEMP/result.json" --report "$RUNNER_TEMP/report.md" \
            ${pr:+--pr "$pr"} --run "$RUN_URL" --env "$DEPLOY_ENV"
      - name: Hand over to the AI review
        if: steps.integrate.outputs.code == '2'
        run: |
          short=${SUBMISSION:0:8}
          filename=$(tail -n1 "$RUNNER_TEMP/filename.txt")
          branch="review/$short"
          git config user.name "mininode-integrate"
          git config user.email "integrate@users.noreply.github.com"
          git checkout -b "$branch"
          mkdir -p "review-inbox/$short"
          cp "$RUNNER_TEMP/upload.zip" "review-inbox/$short/$filename"
          cp "$RUNNER_TEMP/report.md" "review-inbox/$short/REPORT.md"
          git add -f "review-inbox/$short"
          git commit -m "chore: upload $short waits for AI review"
          git push origin "$branch"
          gh label create ai-review --color 5319e7 --description "Upload the integration script could not finish" --force
          {
            echo "<!-- mininode-submission id=$SUBMISSION env=$DEPLOY_ENV -->"
            echo "Ein Upload braucht eine KI-Prüfung. Das ZIP liegt im Branch \`$branch\` unter \`review-inbox/$short/\`."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "**So geht's weiter:** Claude Code mit dem Skill \`integrate-app\` starten (\"arbeite die ai-review-Issues ab\"). Der Lauf baut die App nach \`hosted/<slug>\`, eröffnet einen PR mit \`Closes #<diese Issue>\` und räumt den Branch \`$branch\` ab. Beim Schließen der Issue erscheint die App in Verwaltung → Hochladen als eingebaut."
          } > "$RUNNER_TEMP/issue.md"
          issue=$(gh issue create --title "KI-Prüfung: $filename" --label ai-review --body-file "$RUNNER_TEMP/issue.md")
          pnpm mininode submission status "$SUBMISSION" needs_review \
            --result "$RUNNER_TEMP/result.json" --report "$RUNNER_TEMP/report.md" \
            --review "$issue" --run "$RUN_URL" --env "$DEPLOY_ENV"
      - name: Report a crash
        if: failure() || (steps.integrate.outputs.code != '0' && steps.integrate.outputs.code != '2')
        run: |
          printf 'Der Einbau ist abgestürzt. Protokoll: %s\n' "$RUN_URL" > "$RUNNER_TEMP/crash.md"
          pnpm mininode submission status "$SUBMISSION" failed --report "$RUNNER_TEMP/crash.md" \
            --run "$RUN_URL" --env "$DEPLOY_ENV"
