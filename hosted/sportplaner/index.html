</head>
<body>
<nav class="nav" aria-label="Bereiche">
  <div class="brand">
    <a class="home" href="https://mininode.app"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Alle Apps</a>
    <span class="brand-name"><span class="brand-mark"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-10 4 7 2-3 4 6"/></svg></span>Sportplaner</span>
    <button type="button" class="btn primary side-add" data-action="new"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="side-add-label">Aktivität hinzufügen</span></button>
  </div>
  <div class="tabs">
    <button type="button" class="tab" data-action="tab" data-tab="day"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>Tag</button>
    <button type="button" class="tab" data-action="tab" data-tab="cal"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kalender</button>
    <button type="button" class="tab" data-action="tab" data-tab="lib"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5.5h16M4 12h16M4 18.5h10"/></svg>Bibliothek</button>
    <button type="button" class="tab" data-action="tab" data-tab="stats"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>Statistik</button>
    <button type="button" class="tab" data-action="tab" data-tab="map"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Karte</button>
  </div>
</nav>
<div class="page">
  <header class="top"><div class="top-inner">
    <div class="top-text"><a class="home home-top" href="https://mininode.app">← Alle Apps</a><h1 id="title">Heute</h1><p class="sub" id="subtitle"></p></div>
    <div class="top-tools" id="tools"></div>
    <button type="button" class="add" data-action="new" aria-label="Aktivität hinzufügen"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div></header>
  <main id="view"></main>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status"></div>
