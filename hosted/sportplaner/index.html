<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sportplaner</title>
<link rel="preload" href="/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script src="/_mininode/sdk.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<header class="top"><div class="top-inner">
  <div><a class="home" href="https://mininode.app">← Alle Apps</a><h1 id="title">Heute</h1><p class="sub" id="subtitle"></p></div>
  <button type="button" class="add" data-action="new" aria-label="Aktivität hinzufügen"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div></header>
<main id="view"></main>
<nav class="tabs"><div class="tabs-inner">
  <button type="button" class="tab" data-action="tab" data-tab="day"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>Tag</button>
  <button type="button" class="tab" data-action="tab" data-tab="cal"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kalender</button>
  <button type="button" class="tab" data-action="tab" data-tab="lib"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5.5h16M4 12h16M4 18.5h10"/></svg>Bibliothek</button>
  <button type="button" class="tab" data-action="tab" data-tab="stats"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>Statistik</button>
</div></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
