<!doctype html>
<html lang="de" data-accent="amber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="app.title">CAD</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/_mininode/ui.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/_mininode/ui.js"></script>
  <script src="/_mininode/i18n.js"></script>
  <script src="/_mininode/sdk.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body class="mn-app">
  <nav class="mn-nav" aria-label="Bereiche" data-i18n-attr="aria-label:nav.sections">
    <div class="mn-brand">
      <a class="mn-home" href="/"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="nav.allApps">Alle Apps</span></a>
      <span class="mn-brand-name"><span class="mn-brand-mark"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V5h14M9 15l6-6M5 19l4-4"/></svg></span><span data-i18n="app.title">CAD</span></span>
      <button type="button" class="mn-btn mn-btn--primary" data-add aria-keyshortcuts="n"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="action.newProject">Neues Projekt</span></button>
    </div>
    <div class="mn-tabs">
      <button type="button" class="mn-tab" data-tab="projects" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg><span data-i18n="nav.projects">Projekte</span></button>
      <button type="button" class="mn-tab" data-tab="editor"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/></svg><span data-i18n="nav.editor">Editor</span></button>
      <button type="button" class="mn-tab" data-tab="settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span data-i18n="nav.settings">Einstellungen</span></button>
    </div>
  </nav>
  <div class="mn-page">
    <header class="mn-top"><div class="mn-top-inner">
      <div class="mn-top-text"><a class="mn-home" href="/" data-i18n="nav.allAppsBack">← Alle Apps</a><h1 id="title" tabindex="-1" data-i18n="nav.projects">Projekte</h1><p class="mn-sub" id="subtitle"></p></div>
      <div class="mn-top-tools" id="tools"></div>
      <button type="button" class="mn-fab" data-add aria-label="Neues Projekt" data-i18n-attr="aria-label:action.newProject"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div></header>
    <div class="mn-banner mn-banner--warn cad-offline" id="offline" role="status" hidden></div>
    <main class="mn-main" id="view" tabindex="-1">
      <div class="cad-skeleton"><span class="mn-sk" style="height:72px"></span><span class="mn-sk" style="height:72px"></span><span class="mn-sk" style="height:72px"></span></div>
    </main>
  </div>
</body>
</html>
